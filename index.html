<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFF7EE" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Super Me" />
  <meta name="description" content="Super Me — diario personale di cibo, sport e pressione" />
  <title>Super Me</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="todayLabel">OGGI</p>
        <h1 id="pageTitle">Super Me</h1>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Obiettivi e profilo">☀</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav" aria-label="Navigazione principale">
      <button data-tab="today" class="nav-item active"><span>⌂</span><small>Oggi</small></button>
      <button data-tab="food" class="nav-item"><span>●</span><small>Cibo</small></button>
      <button id="addBtn" class="add-btn" aria-label="Aggiungi">+</button>
      <button data-tab="sport" class="nav-item"><span>↗</span><small>Sport</small></button>
      <button data-tab="pressure" class="nav-item"><span>♥</span><small>Pressione</small></button>
    </nav>
  </div>

  <div id="sheetBackdrop" class="sheet-backdrop hidden"></div>
  <section id="sheet" class="sheet hidden" aria-modal="true" role="dialog"></section>
  <input id="photoInput" type="file" accept="image/*" capture="environment" hidden />
  <script src="/app.js"></script>
</body>
</html>
